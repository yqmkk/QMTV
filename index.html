<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注视影视 - 极致聚合影音系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
    <!-- Hls.js for M3U8 streaming -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.292.0/umd/lucide.min.js"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 默认内置的公共影视搜索跳转源
        const DEFAULT_SITES = [
            { id: 'xjju', name: '选剧集', searchUrl: 'https://www.xuanjuji.com/vodsearch/-------------.html?wd=' },
            { id: 'cupfox', name: '茶杯狐 Cupfox', searchUrl: 'https://www.cupfox.com/search?key=' }
        ];

        // 默认可导入的播放源示例 (可解析m3u8/mp4)
        const DEFAULT_SOURCES = [
            { id: '1', name: '官方高清同步源', url: 'https://v3.szjal.cn/20210416/Z763Aca9/index.m3u8', type: 'm3u8', delay: null },
            { id: '2', name: '备用海外加速源', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', type: 'm3u8', delay: null },
            { id: '3', name: 'MP4 测速示例源', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', type: 'mp4', delay: null }
        ];

        function App() {
            // 状态管理
            const [currentSite, setCurrentSite] = useState(DEFAULT_SITES[0]);
            const [searchKeyword, setSearchKeyword] = useState('');
            const [sources, setSources] = useState(() => {
                const saved = localStorage.getItem('movie_sources');
                return saved ? JSON.parse(saved) : DEFAULT_SOURCES;
            });
            const [activeSource, setActiveSource] = useState(null);
            const [testing, setTesting] = useState(false);
            
            // 导入新源表单状态
            const [newSourceName, setNewSourceName] = useState('');
            const [newSourceUrl, setNewSourceUrl] = useState('');
            const [newSourceType, setNewSourceType] = useState('m3u8');

            const videoRef = useRef(null);
            const hlsRef = useRef(null);

            // 监听源变化存入本地存储
            useEffect(() => {
                localStorage.setItem('movie_sources', JSON.stringify(sources));
            }, [sources]);

            // 切换视频源播放逻辑
            useEffect(() => {
                if (!activeSource || !videoRef.current) return;

                // 清理旧的 Hls 实例
                if (hlsRef.current) {
                    hlsRef.current.destroy();
                    hlsRef.current = null;
                }

                const video = videoRef.current;

                if (activeSource.type === 'm3u8') {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(activeSource.url);
                        hls.attachMedia(video);
                        hlsRef.current = hls;
                        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // 针对 Safari 原生支持
                        video.src = activeSource.url;
                        video.addEventListener('loadedmetadata', () => video.play());
                    }
                } else {
                    // MP4 或其他原生格式
                    video.src = activeSource.url;
                    video.play().catch(e => console.log("自动播放被拦截:", e));
                }
            }, [activeSource]);

            // 聚合搜索跳转
            const handleSearch = (e) => {
                e.preventDefault();
                if (!searchKeyword.trim()) return;
                const fullUrl = `${currentSite.searchUrl}${encodeURIComponent(searchKeyword)}`;
                window.open(fullUrl, '_blank');
            };

            // 导入新播放源
            const handleAddSource = (e) => {
                e.preventDefault();
                if (!newSourceName || !newSourceUrl) return alert('请完整填写名称和URL');
                
                const newSrc = {
                    id: Date.now().toString(),
                    name: newSourceName,
                    url: newSourceUrl,
                    type: newSourceType,
                    delay: null
                };

                setSources([...sources, newSrc]);
                setNewSourceName('');
                setNewSourceUrl('');
            };

            // 删除源
            const handleDeleteSource = (id) => {
                setSources(sources.filter(src => src.id !== id));
                if (activeSource && activeSource.id === id) setActiveSource(null);
            };

            // 一键测速逻辑
            const handleSpeedTest = async () => {
                setTesting(true);
                const updatedSources = [...sources];

                for (let i = 0; i < updatedSources.length; i++) {
                    const start = performance.now();
                    try {
                        // 使用 mode: 'no-cors' 允许跨域嗅探请求时间
                        await fetch(updatedSources[i].url, { mode: 'no-cors', cache: 'no-cache' });
                        const end = performance.now();
                        updatedSources[i].delay = Math.round(end - start);
                    } catch (error) {
                        updatedSources[i].delay = '超时/异常';
                    }
                    setSources([...updatedSources]);
                }
                setTesting(false);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Top Header */}
                    <header className="bg-gray-900 border-b border-gray-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex items-center space-x-3">
                            <div className="bg-blue-600 p-2 rounded-lg text-white font-bold tracking-wider text-xl">注视</div>
                            <span className="text-xl font-semibold tracking-wide text-white">影视聚合系统</span>
                        </div>

                        {/* 搜索与站点切换区域 */}
                        <form onSubmit={handleSearch} className="flex items-center bg-gray-800 rounded-full px-4 py-2 w-full md:w-auto max-w-xl flex-1 mx-4 border border-gray-700 focus-within:border-blue-500 transition">
                            <select 
                                value={currentSite.id} 
                                onChange={(e) => setCurrentSite(DEFAULT_SITES.find(s => s.id === e.target.value))}
                                className="bg-transparent text-gray-300 font-medium mr-3 pr-2 border-r border-gray-700 outline-none cursor-pointer text-sm"
                            >
                                {DEFAULT_SITES.map(site => (
                                    <option key={site.id} value={site.id} className="bg-gray-800">{site.name}</option>
                                ))}
                            </select>
                            <input 
                                type="text" 
                                placeholder={`在 [${currentSite.name}] 中搜索片源并获取播放地址...`}
                                value={searchKeyword}
                                onChange={(e) => setSearchKeyword(e.target.value)}
                                className="bg-transparent text-white w-full outline-none text-sm placeholder-gray-500"
                            />
                            <button type="submit" className="text-blue-500 hover:text-blue-400 font-medium text-sm ml-2 shrink-0">
                                去搜索 ↗
                            </button>
                        </form>

                        <div className="text-xs text-gray-400 bg-gray-800 px-3 py-1.5 rounded-md border border-gray-700">
                            已托管于静态节点
                        </div>
                    </header>

                    {/* Main Content Workspace */}
                    <div className="flex-1 grid grid-cols-1 lg:grid-cols-4 overflow-hidden">
                        
                        {/* 左侧及中间：播放器核心区 */}
                        <div className="lg:col-span-3 p-6 flex flex-col space-y-4 border-r border-gray-800">
                            {/* 播放器容器 */}
                            <div className="bg-black rounded-xl overflow-hidden shadow-2xl aspect-video w-full border border-gray-800 relative flex items-center justify-center">
                                {activeSource ? (
                                    <video 
                                        ref={videoRef} 
                                        controls 
                                        className="w-full h-full object-contain"
                                        controlsList="nodownload"
                                    />
                                ) : (
                                    <div className="text-center p-6">
                                        <div className="text-blue-500 text-5xl mb-4">📺</div>
                                        <p className="text-gray-400 text-lg mb-2">暂无正在播放的源</p>
                                        <p className="text-xs text-gray-600 max-w-md">请先在上方切换搜索源查找你想看的电影，复制其视频流地址（.m3u8/.mp4），并在右侧管理面板中导入播放。</p>
                                    </div>
                                )}
                            </div>

                            {/* 正在播放信息 */}
                            {activeSource && (
                                <div className="bg-gray-900/50 p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                                    <div>
                                        <span className="text-xs font-semibold bg-blue-600/20 text-blue-400 px-2.5 py-1 rounded-full uppercase tracking-wider">{activeSource.type}</span>
                                        <h2 className="text-lg font-medium text-white mt-2">{activeSource.name}</h2>
                                        <p className="text-xs text-gray-500 break-all mt-1">{activeSource.url}</p>
                                    </div>
                                </div>
                            )}

                            {/* 快捷使用指引 */}
                            <div className="bg-gray-900/30 border border-gray-800/80 rounded-xl p-5 text-sm text-gray-400 space-y-2">
                                <h3 className="text-white font-medium mb-1">💡 GitHub / Cloudflare Pages 静态部署说明：</h3>
                                <p>1. 本站为<b>纯前端架构</b>，数据全留存在您本地浏览器中，完全防封、响应极快。</p>
                                <p>2. <b>操作流程：</b>在上方的下拉框选择 <b>选剧集</b> 或 <b>茶杯狐</b> ➔ 输入电影名搜索 ➔ 进入第三方站找到视频源（或使用F12抓取 `.m3u8`）➔ 复制地址并在右侧“导入新源”中粘贴 ➔ 点击下方节点直接解码播放。</p>
                            </div>
                        </div>

                        {/* 右侧：源管理与测速面板 */}
                        <div className="lg:col-span-1 p-6 flex flex-col space-y-6 bg-gray-900/20 h-[calc(100vh-80px)] overflow-y-auto custom-scrollbar">
                            
                            {/* 导入新源面板 */}
                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                <h3 className="text-sm font-semibold text-white mb-3 flex items-center gap-2">
                                    ➕ 导入自定义源地址
                                </h3>
                                <form onSubmit={handleAddSource} className="space-y-3">
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">接口名称</label>
                                        <input 
                                            type="text" 
                                            placeholder="如：原画独家直连源" 
                                            value={newSourceName}
                                            onChange={(e) => setNewSourceName(e.target.value)}
                                            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">源地址 (URL)</label>
                                        <input 
                                            type="text" 
                                            placeholder="支持 http...m3u8 或 .mp4" 
                                            value={newSourceUrl}
                                            onChange={(e) => setNewSourceUrl(e.target.value)}
                                            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 block mb-1">格式类型</label>
                                        <select 
                                            value={newSourceType}
                                            onChange={(e) => setNewSourceType(e.target.value)}
                                            className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500"
                                        >
                                            <option value="m3u8">M3U8 (流媒体)</option>
                                            <option value="mp4">MP4/WebM (常规格式)</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 rounded-lg transition shadow-lg shadow-blue-600/10">
                                        确 认 导 入
                                    </button>
                                </form>
                            </div>

                            {/* 播放源管理与测速 */}
                            <div className="flex-1 flex flex-col min-h-[300px]">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-sm font-semibold text-white flex items-center gap-2">
                                        📋 播放节点管理 ({sources.length})
                                    </h3>
                                    <button 
                                        onClick={handleSpeedTest} 
                                        disabled={testing}
                                        className={`text-xs px-2.5 py-1 rounded border transition font-medium ${testing ? 'bg-gray-800 border-gray-700 text-gray-500' : 'border-emerald-500/30 bg-emerald-500/10 text-emerald-400 hover:bg-emerald-500/20'}`}
                                    >
                                        {testing ? '测速中...' : '⚡ 一键测速'}
                                    </button>
                                </div>

                                <div className="space-y-2 overflow-y-auto flex-1 pr-1 custom-scrollbar">
                                    {sources.map((src) => {
                                        const isSelected = activeSource && activeSource.id === src.id;
                                        return (
                                            <div 
                                                key={src.id}
                                                className={`p-3 rounded-lg border transition cursor-pointer flex justify-between items-center group relative ${isSelected ? 'bg-blue-600/10 border-blue-500' : 'bg-gray-900 border-gray-800/60 hover:border-gray-700'}`}
                                                onClick={() => setActiveSource(src)}
                                            >
                                                <div className="flex-1 min-w-0 mr-2">
                                                    <div className="flex items-center space-x-2">
                                                        <span className={`w-2 h-2 rounded-full ${isSelected ? 'bg-blue-500 animate-pulse' : 'bg-gray-600'}`}></span>
                                                        <p className="text-sm font-medium text-gray-200 truncate">{src.name}</p>
                                                    </div>
                                                    <p className="text-xs text-gray-500 truncate mt-1">{src.url}</p>
                                                </div>

                                                <div className="flex items-center space-x-2 shrink-0">
                                                    {/* 延迟显示 */}
                                                    {src.delay !== null && (
                                                        <span className={`text-[10px] px-1.5 py-0.5 rounded font-mono ${typeof src.delay === 'number' ? (src.delay < 300 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400') : 'bg-rose-500/10 text-rose-400'}`}>
                                                            {typeof src.delay === 'number' ? `${src.delay}ms` : src.delay}
                                                        </span>
                                                    )}
                                                    {/* 删除按钮 */}
                                                    <button 
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            handleDeleteSource(src.id);
                                                        }}
                                                        className="text-gray-500 hover:text-rose-400 p-1 rounded hover:bg-gray-800 opacity-0 group-hover:opacity-100 transition-opacity"
                                                        title="删除此源"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}

                                    {sources.length === 0 && (
                                        <div className="text-center py-8 text-gray-600 text-xs">
                                            暂无可用播放源，请在上方导入
                                        </div>
                                    )}
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
